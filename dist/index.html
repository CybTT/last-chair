<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#485641">
<title>Last Chair</title><meta name="description" content="A pixel-art game of musical chairs.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%237e303b' d='M6 3h20v18H6zM8 21h4v9H8zm12 0h4v9h-4z'/%3E%3Cpath fill='%23dfc38b' d='M9 6h14v10H9z'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css">
</head>
<body><main class="cabinet">
<header><a href="./" class="brand">LAST CHAIR</a><button id="sound" class="icon-button" aria-label="Enable sound" aria-pressed="false">SOUND: OFF</button></header>
<section class="play-section" aria-label="Game arena">
<div class="stage-top"><span id="round">1 / 3</span><div id="signal" class="signal"><i></i><span>READY</span></div><span id="chairs">3 CHAIRS</span></div>
<div class="scene">
<canvas id="game" width="960" height="600" aria-label="Four guests walking around the chairs"></canvas>
<div id="intro" class="overlay start-overlay"><button id="start" class="primary">PLAY</button></div>
<div id="result" class="overlay hidden"><div class="result-card"><h2 id="result-title"></h2><p id="result-body"></p><button id="next" class="primary">NEXT</button></div></div>
<div id="pause-overlay" class="overlay hidden"><div class="result-card"><h2>PAUSED</h2><button id="resume" class="primary">RESUME</button></div></div>
<div id="countdown" class="countdown hidden"></div>
</div>
<div class="control-deck"><strong id="reaction" aria-label="Reaction time">— <small>ms</small></strong><button id="sit" disabled><span>SIT</span><kbd>SPACE</kbd></button><button id="pause" class="pause" disabled aria-label="Pause game">Ⅱ</button></div>
<p id="hint" class="sr-only" role="status" aria-live="polite"></p>
</section>
<div id="roster" class="roster" aria-label="Players"></div>
<p class="credit">made by cybtt</p>
</main><script src="game.js"></script></body></html>
